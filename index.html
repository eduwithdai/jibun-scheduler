<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>きょうの じかんわり</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    background: linear-gradient(160deg, #FFF8EE 0%, #EEF6FF 100%);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* ── ヘッダー ── */
  #header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: rgba(255,255,255,0.92);
    border-bottom: 3px solid #FFD080;
    flex-shrink: 0;
    min-height: 64px;
  }

  #title {
    font-size: 18px;
    font-weight: bold;
    color: #E67E22;
    white-space: nowrap;
  }

  #banner {
    flex: 1;
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    color: #5D6D7E;
    background: #F4F6F7;
    border: 3px solid #D5D8DC;
    border-radius: 36px;
    padding: 10px 16px;
    transition: all 0.2s;
    line-height: 1.2;
  }
  #banner.ready {
    color: #C0392B;
    background: #FEF0E7;
    border-color: #E67E22;
  }

  .hdr-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 64px;
    min-height: 52px;
    border-radius: 16px;
    border-width: 3px;
    border-style: solid;
    cursor: pointer;
    font-weight: bold;
    gap: 1px;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  .hdr-btn .ico { font-size: 22px; }
  .hdr-btn .lbl { font-size: 13px; white-space: nowrap; }
  #btn-save  { background:#EBF5FB; border-color:#AED6F1; color:#2471A3; }
  #btn-reset { background:#FDEDEC; border-color:#F5B7B1; color:#C0392B; }
  #btn-read  { background:#E8F8F5; border-color:#A3E4D7; color:#117A65; }
  #btn-sound { background:#FEF9E7; border-color:#F7DC6F; color:#9A7D0A; }
  /* 音がオフのとき／読み上げ中に押せないとき */
  .hdr-btn.off      { background:#F4F6F7; border-color:#D5D8DC; color:#98A3A8; }
  .hdr-btn[disabled] { opacity: 0.4; cursor: default; }
  /* 読み上げ中のボタン */
  #btn-read.speaking { background:#16A085; border-color:#0E6655; color:#fff; }

  /* せってい（長押しで開く）。押している間だけ色が伸びて、進み具合が見える。 */
  #btn-settings {
    background:#F4ECF7; border-color:#D2B4DE; color:#6C3483;
    position: relative;
    overflow: hidden;
  }
  #btn-settings::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 0; height: 100%;
    background: #BB8FCE66;
  }
  #btn-settings.holding::after {
    width: 100%;
    transition: width 0.8s linear;
  }
  #btn-settings .ico, #btn-settings .lbl { position: relative; z-index: 1; }

  /* ── メインエリア ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
    gap: 8px;
    padding: 8px;
    min-height: 0;
  }

  /* ── 左：スロット ── */
  #slots {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 38%;
    flex-shrink: 0;
    min-height: 0;
  }

  .slot {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 4px solid #D5D8DC;
    background: rgba(255,255,255,0.75);
    transition: all 0.18s;
    cursor: default;
    min-height: 0;
  }
  .slot.can-receive {
    border-color: #F39C12;
    background: #FFFBF0;
    box-shadow: 0 0 0 3px #F39C1240, 0 4px 12px rgba(0,0,0,0.1);
    transform: scale(1.02);
    cursor: pointer;
  }
  .slot.can-erase {
    border-color: #E74C3C;
    box-shadow: 0 0 0 3px #E74C3C40, 0 4px 12px rgba(0,0,0,0.1);
    transform: scale(1.02);
    cursor: pointer;
  }
  .slot.filled {
    box-shadow: 0 2px 6px rgba(0,0,0,0.07);
  }
  /* いま読み上げているコマ */
  .slot.speaking {
    outline: 5px solid #16A085;
    outline-offset: 2px;
    transform: scale(1.03);
  }

  /* 「1じかん」— 大きく・濃く */
  .slot-label {
    font-size: clamp(17px, 2.7vh, 27px);
    font-weight: bold;
    color: #46545E;
    min-width: 3.6em;
    flex-shrink: 0;
    line-height: 1.15;
    text-align: center;
  }
  .slot.can-receive .slot-label,
  .slot.can-erase .slot-label { color: #D35400; }

  .slot-content {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
    height: 100%;
  }
  .slot-img {
    max-height: 100%;
    max-width: 44%;
    flex-shrink: 0;
    object-fit: contain;
  }
  .slot-emoji { font-size: clamp(24px, 4vh, 38px); flex-shrink: 0; }
  .slot-name  {
    font-size: clamp(16px, 2.6vh, 26px);
    font-weight: bold;
    line-height: 1.15;
    white-space: pre-line;
  }

  /* 「あいてるよ」— 大きく・濃く */
  .slot-hint  {
    font-size: clamp(17px, 2.8vh, 28px);
    font-weight: bold;
    color: #7B8A91;
  }
  .slot.can-receive .slot-hint,
  .slot.can-erase  .slot-hint { color: #D35400; }

  /* ── 右：カードパレット ── */
  #palette {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    align-content: stretch;
    min-height: 0;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    border: 4px solid #E0E8F0;
    background: rgba(255,255,255,0.92);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: all 0.15s;
    padding: 6px 4px 4px;
    min-height: 0;
    overflow: hidden;
  }
  .card.selected {
    box-shadow: 0 0 0 4px var(--c40), 0 6px 20px rgba(0,0,0,0.15);
    transform: scale(1.07);
    outline: 3px solid var(--col);
    outline-offset: 3px;
  }
  /* 教科の絵 */
  .card-img {
    flex: 1;
    min-height: 0;
    width: 100%;
    object-fit: contain;
  }
  .card-emoji {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 5vh, 46px);
  }
  /* 絵の下に、ひらがなの教科名 */
  .card-kana {
    flex-shrink: 0;
    font-size: clamp(14px, 2.2vh, 21px);
    font-weight: bold;
    margin-top: 3px;
    text-align: center;
    line-height: 1.2;
    white-space: pre-line;
  }

  /* ── トースト ── */
  #toast {
    position: absolute;
    top: 74px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    padding: 12px 32px;
    border-radius: 36px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    z-index: 300;   /* せってい画面より手前 */
    pointer-events: none;
    display: none;
    white-space: nowrap;
  }

  /* ── せってい画面 ── */
  #settings {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }
  #settings[hidden] { display: none !important; }

  #settings-box {
    width: min(920px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: #FFFDF8;
    border: 4px solid #D2B4DE;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }

  .st-head, .st-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: #F4ECF7;
    flex-shrink: 0;
  }
  .st-head { border-bottom: 2px solid #E8DAEF; }
  .st-foot { border-top: 2px solid #E8DAEF; }
  .st-title { font-size: 19px; font-weight: bold; color: #6C3483; flex: 1; }
  .st-note  { font-size: 12px; color: #7F8C8D; flex: 1; line-height: 1.4; }

  #settings-list {
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .st-row {
    display: grid;
    grid-template-columns: 40px 68px minmax(104px, 1fr) auto;
    gap: 8px;
    align-items: center;
    padding: 6px 8px;
    border: 2px solid #E8E0EF;
    border-radius: 14px;
    background: #fff;
  }

  .st-ord { display: flex; flex-direction: column; gap: 3px; }
  .st-ord .st-btn { padding: 4px 0; width: 36px; }

  .st-thumb {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .st-img   { max-height: 58px; max-width: 68px; object-fit: contain; }
  .st-emoji { font-size: 30px; }

  .st-kana {
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    line-height: 1.25;
    border: 2px solid #D5D8DC;
    border-radius: 10px;
    padding: 5px 7px;
    resize: none;
    height: 58px;
    width: 100%;
  }
  .st-kana:focus { outline: 3px solid #D2B4DE; border-color: #BB8FCE; }

  .st-acts {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: flex-end;
  }

  .st-btn {
    font-family: inherit;
    font-weight: bold;
    font-size: 13px;
    border: 2px solid #AED6F1;
    background: #EBF5FB;
    color: #21618C;
    border-radius: 10px;
    padding: 7px 9px;
    cursor: pointer;
    white-space: nowrap;
  }
  .st-btn:disabled { opacity: 0.3; cursor: default; }
  /* 文字が変わるボタンは幅を固定して、行ごとに ますの幅が ずれないようにする */
  .st-btn.play   { min-width: 8.4em; }   /* ▶ もとの おと／ろくおん／よみあげ */
  .st-btn.recbtn { min-width: 7.4em; }   /* 🎙 ろくおん／⏹ とめる 10 */
  /* そのカードに自前の絵／音が入っているとき */
  .st-btn.has  { border-color:#A3E4D7; background:#E8F8F5; color:#117A65; }
  .st-btn.warn { border-color:#F5B7B1; background:#FDEDEC; color:#C0392B; }
  /* 録音中 */
  .st-btn.rec {
    border-color: #C0392B;
    background: #E74C3C;
    color: #fff;
    animation: recPulse 1s ease-in-out infinite;
  }
  @keyframes recPulse {
    50% { box-shadow: 0 0 0 5px #E74C3C44; }
  }
</style>
</head>
<body>

<!-- ヘッダー -->
<div id="header">
  <div id="title">📅 じかんわり</div>
  <div id="banner">かもくカードを えらんでね</div>
  <button class="hdr-btn" id="btn-read">
    <span class="ico">📢</span><span class="lbl">よみあげ</span>
  </button>
  <button class="hdr-btn" id="btn-sound" aria-pressed="true">
    <span class="ico">🔊</span><span class="lbl">おと</span>
  </button>
  <button class="hdr-btn" id="btn-save">
    <span class="ico">💾</span><span class="lbl">ほぞん</span>
  </button>
  <button class="hdr-btn" id="btn-reset">
    <span class="ico">🔄</span><span class="lbl">リセット</span>
  </button>
  <!-- こどもが さわっても すぐ開かないように、長押しでだけ開く -->
  <button class="hdr-btn" id="btn-settings" title="ながおしで ひらきます">
    <span class="ico">⚙️</span><span class="lbl">せってい</span>
  </button>
</div>

<!-- メイン -->
<div id="main">
  <div id="slots"></div>
  <div id="palette"></div>
</div>

<!-- トースト -->
<div id="toast"></div>

<!-- せってい画面（かもくカードの ならびかえ・もじ・え・おと） -->
<div id="settings" hidden>
  <div id="settings-box">
    <div class="st-head">
      <div class="st-title">⚙️ かもくカードの せってい</div>
      <button class="st-btn" id="btn-settings-close">とじる</button>
    </div>
    <div id="settings-list"></div>
    <div class="st-foot">
      <div class="st-note">
        へんこうは この タブレット（ブラウザ）だけに のこります。<br>
        もじの 2ぎょうめは、ますの なかで かいぎょう すると つくれます。<br>
        🎙 ろくおん は もういちど おすと とまります（いちばん ながくて 10びょう）。
      </div>
      <button class="st-btn warn" id="btn-settings-reset">ぜんぶ もとにもどす</button>
    </div>
  </div>
</div>

<script>
// kana は画面に出すひらがなの教科名（改行は \n）。img があれば絵、なければ emoji を使う。
const SUBJECTS = [
  { id:"nichijo",  img:"images/nichijo.png",  kana:"にちじょう\nせいかつ", color:"#7D5A3C", bg:"#FDF3EB" },
  { id:"kokugo",   img:"images/kokugo.png",   kana:"こくご",              color:"#C0392B", bg:"#FDEDEC" },
  { id:"sansu",    img:"images/sansu.png",    kana:"さんすう",            color:"#E67E22", bg:"#FEF9E7" },
  { id:"zuko",     img:"images/zuko.png",     kana:"ずこう",              color:"#E91E8C", bg:"#FDE8F4" },
  { id:"seikatsu", img:"images/seikatsu.png", kana:"せいかつ",            color:"#1A7A42", bg:"#E9F7EF" },
  { id:"taiiku",   img:"images/taiiku.png",   kana:"たいいく",            color:"#D35400", bg:"#FEF5E7" },
  { id:"ongaku",   img:"images/ongaku.png",   kana:"おんがく",            color:"#7D3C98", bg:"#F4ECF7" },
  { id:"dotoku",   img:"images/dotoku.png",   kana:"どうとく",            color:"#B7950B", bg:"#FEFDE7" },
  { id:"sogo",     img:"images/sogo.png",     kana:"そうごう",            color:"#1F5E99", bg:"#EBF5FB" },
  { id:"tokkatsu", img:"images/tokkatsu.png", kana:"とくべつ\nかつどう",  color:"#0E7A6E", bg:"#E8F8F5" },
  { id:"jiritsu",  img:"images/jiritsu.png",  kana:"じりつ",              color:"#5B3DB8", bg:"#EFE8FF" },
  { id:"clear",    emoji:"✖️",                kana:"けす",                color:"#95A5A6", bg:"#F8F9F9", isClear:true },
];

const PERIOD_SHORT = ["1じかん","2じかん","3じかん","4じかん","5じかん","6じかん"];
// 読み上げ用。「4じかんめ」は「よじかんめ」と読ませたいので、かなで持つ。
const PERIOD_SPEAK = ["いちじかんめ","にじかんめ","さんじかんめ","よじかんめ","ごじかんめ","ろくじかんめ"];
const STORAGE_KEY  = "jikanwari_schedule";
const TTS_KEY      = "jikanwari_tts";
const CARDS_KEY    = "jikanwari_cards";

let schedule = Array(6).fill(null); // 各コマに入った subject or null
let selected  = null;               // 選択中の subject or null
let toastTimer = null;

const flat = s => s.kana.replace(/\n/g, "");

// ── カードの せってい ────────────────────
// もじと ならび順は localStorage に。絵と音は大きいので IndexedDB に
// Blob のまま入れる（localStorage だと容量が足りなくなる）。
const DEFAULT_KANA = {};
SUBJECTS.forEach(s => { DEFAULT_KANA[s.id] = s.kana; });

let cardConf  = {};    // id → { kana }
let cardOrder = null;  // [id, …]。null なら もとの順番
let customImg = {};    // id → ObjectURL（自前の絵）
let customSnd = {};    // id → ObjectURL（自前の音）

// 絵と音の「どれを使うか」は、ここだけで決める
const imgSrc   = s => customImg[s.id] || s.img || null;
const soundSrc = s => customSnd[s.id] || (s.isClear ? null : SOUND_DIR + s.id + ".mp3");

// けすカードは いつも いちばん最後。それ以外を cardOrder の順に並べる。
function orderedSubjects() {
  const real  = SUBJECTS.filter(s => !s.isClear);
  const clear = SUBJECTS.filter(s =>  s.isClear);
  if (!cardOrder) return [...real, ...clear];
  const known = cardOrder.map(id => real.find(s => s.id === id)).filter(Boolean);
  const rest  = real.filter(s => !cardOrder.includes(s.id));  // あとから増えた分
  return [...known, ...rest, ...clear];
}

function applyCardConf() {
  SUBJECTS.forEach(s => {
    const k = cardConf[s.id] && cardConf[s.id].kana;
    s.kana = (k && k.trim()) ? k : DEFAULT_KANA[s.id];
  });
}

function saveCards() {
  try {
    localStorage.setItem(CARDS_KEY, JSON.stringify({ order: cardOrder, conf: cardConf }));
  } catch (_) {
    showToast("error");
  }
}

function loadCards() {
  try {
    const raw = localStorage.getItem(CARDS_KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (Array.isArray(o.order)) cardOrder = o.order;
    if (o.conf && typeof o.conf === "object") cardConf = o.conf;
    applyCardConf();
  } catch (_) {}
}

// ── IndexedDB（絵と音の入れもの） ──────────
const DB_NAME = "jikanwari", DB_STORE = "media";
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error("IndexedDB なし")); return; }
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
  return dbPromise;
}

function dbTx(mode, fn) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx  = db.transaction(DB_STORE, mode);
    const req = fn(tx.objectStore(DB_STORE));
    tx.oncomplete = () => res(req ? req.result : undefined);
    tx.onerror    = () => rej(tx.error);
    tx.onabort    = () => rej(tx.error);
  }));
}

const mediaGet  = k      => dbTx("readonly",  st => st.get(k));
const mediaSet  = (k, v) => dbTx("readwrite", st => st.put(v, k));
const mediaDel  = k      => dbTx("readwrite", st => st.delete(k));
const mediaKeys = ()     => dbTx("readonly",  st => st.getAllKeys());

// 保存してある絵と音を読み出して ObjectURL にする。
// キーは "img:<id>" / "snd:<id>"。
async function loadCustomMedia() {
  let keys;
  try { keys = await mediaKeys(); } catch (_) { return; }
  for (const key of keys) {
    try {
      const blob = await mediaGet(key);
      if (!blob) continue;
      const kind = key.slice(0, 3), id = key.slice(4);
      const url = URL.createObjectURL(blob);
      if (kind === "img") customImg[id] = url;
      if (kind === "snd") customSnd[id] = url;
    } catch (_) {}
  }
}

// 差し替え前の ObjectURL と、その Audio を捨てる
function dropMediaUrl(map, id) {
  const old = map[id];
  if (!old) return;
  URL.revokeObjectURL(old);
  delete audioCache[old];
  audioFailed.delete(old);
  delete map[id];
}

// ── 読み上げ ──────────────────────────────
// sounds/ の音声ファイルを鳴らす。ファイルが無い・読めないものは
// ブラウザ内蔵の音声合成で代用する。どちらもネットにはつながない。
const SOUND_DIR = "sounds/";
const synth = window.speechSynthesis || null;
let ttsOn   = true;   // 「おと」ボタンの状態
let jaVoice = null;   // 合成音声で使う日本語の声
let sayGen  = 0;      // 世代番号。stopSpeak で進めて、古い連鎖を捨てる。
let curAudio = null;  // いま鳴っている音声ファイル

const audioCache  = {};        // src → Audio
// 読めなかった src → その時刻。しばらくは合成音声で代用し、
// 時間がたったら もう一度ファイルを試す（Wi-Fi が一瞬切れただけで
// その日ずっと合成音声になるのを防ぐ）。
const audioFailed = new Map();
const AUDIO_RETRY_MS = 30000;
const recentlyFailed = src => {
  const t = audioFailed.get(src);
  return t !== undefined && Date.now() - t < AUDIO_RETRY_MS;
};

function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  jaVoice = vs.find(v => v.lang === "ja-JP")
         || vs.find(v => (v.lang || "").toLowerCase().startsWith("ja"))
         || null;
}
if (synth) {
  pickVoice();
  // 声の一覧は非同期で届くブラウザがある
  synth.addEventListener("voiceschanged", pickVoice);
}

// ── 読み上げの「ひとかたまり」 ──
// src があれば音声ファイル、無ければ text を合成音声で読む。
// 教科の音は、せっていで入れ替えたものがあれば そちらを使う。
const msg = (file, text) => ({ src: SOUND_DIR + file, text });

const partPeriod  = i => ({ src: SOUND_DIR + `period${i + 1}.mp3`, text: PERIOD_SPEAK[i] + "は、" });
const partSubject = s => ({ src: soundSrc(s), text: flat(s) });

const MSG = {
  askErase:  msg("ask_erase.mp3",  "けす。どのじかんを けす？"),
  erased:    msg("erased.mp3",     "けしたよ"),
  readIntro: msg("read_intro.mp3", "きょうの じかんわりだよ"),
  empty:     msg("empty.mp3",      "きょうの よていは まだ はいっていないよ"),
  saved:     msg("saved.mp3",      "ほぞんしたよ"),
  reset:     msg("reset.mp3",      "ぜんぶ けしたよ"),
  soundOn:   msg("sound_on.mp3",   "おとを つけたよ"),
  cheer:     msg("today.mp3",      "きょうも いちにち がんばろう"),
};

// パーツを順番に鳴らす。onEnd は最後まで鳴り終わったときだけ呼ぶ。
function say(parts, onEnd) {
  if (!ttsOn) { onEnd && onEnd(); return; }
  const gen = sayGen;
  let k = 0;
  const next = () => {
    if (gen !== sayGen) return;              // 途中で止められた
    if (k >= parts.length) { onEnd && onEnd(); return; }
    playPart(parts[k++], gen, next);
  };
  next();
}

function playPart(part, gen, done) {
  if (!part.src || recentlyFailed(part.src)) { speakText(part.text, gen, done); return; }

  let a = audioCache[part.src];
  // 前に失敗した Audio は使いまわさず、作りなおして もう一度読ませる
  if (a && audioFailed.has(part.src)) { delete audioCache[part.src]; a = null; }
  if (!a) {
    a = new Audio(part.src);
    a.preload = "auto";
    audioCache[part.src] = a;
  }
  curAudio = a;

  let settled = false;
  const finish = () => {
    if (settled) return;
    settled = true;
    if (curAudio === a) curAudio = null;
    audioFailed.delete(part.src);   // 鳴ったので、失敗の記録は消す
    if (gen === sayGen) done();
  };
  // 鳴らせなかったとき。ただし stopSpeak で止めた場合はここを通っても
  // 「壊れている」とは見なさない（gen がずれているので判別できる）。
  const fail = () => {
    if (settled) return;
    settled = true;
    if (curAudio === a) curAudio = null;
    if (gen !== sayGen) return;
    audioFailed.set(part.src, Date.now());
    speakText(part.text, gen, done);
  };

  a.onended = finish;
  a.onerror = fail;
  try { a.currentTime = 0; } catch (_) {}
  const p = a.play();
  if (p && p.catch) p.catch(fail);
}

function speakText(text, gen, done) {
  if (!synth) { if (gen === sayGen) done(); return; }
  let settled = false;
  const finish = () => {
    if (settled) return;
    settled = true;
    if (gen === sayGen) done();
  };
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang  = "ja-JP";
    if (jaVoice) u.voice = jaVoice;
    u.rate  = 0.95;  // こども向けに少しゆっくり
    u.pitch = 1.05;
    u.onend = finish;
    u.onerror = finish;
    synth.speak(u);
  } catch (_) {
    finish();
  }
}

// 今鳴っているものを止める（連鎖読み上げも打ち切る）
function stopSpeak() {
  sayGen++;
  if (curAudio) {
    try { curAudio.pause(); curAudio.currentTime = 0; } catch (_) {}
    curAudio = null;
  }
  if (synth) { try { synth.cancel(); } catch (_) {} }
  clearSpeakingMark();
  setReadingUI(false);
}

function markSpeaking(i) {
  clearSpeakingMark();
  const el = document.querySelectorAll("#slots .slot")[i];
  if (el) el.classList.add("speaking");
}

function clearSpeakingMark() {
  document.querySelectorAll("#slots .slot.speaking")
    .forEach(el => el.classList.remove("speaking"));
}

function setReadingUI(reading) {
  const btn = document.getElementById("btn-read");
  if (btn) btn.classList.toggle("speaking", reading);
}

// 時間割をぜんぶ順番に読む
function readAll() {
  if (!ttsOn) return;
  stopSpeak();
  const gen = sayGen;

  const items = [];
  schedule.forEach((it, i) => { if (it) items.push({ i, it }); });

  if (items.length === 0) {
    say([MSG.empty]);
    return;
  }

  setReadingUI(true);
  let k = 0;
  const step = () => {
    if (gen !== sayGen) return;             // 途中で止められた
    if (k >= items.length) {                // 読み終わり → 最後にひとこと
      clearSpeakingMark();
      say([MSG.cheer], () => setReadingUI(false));
      return;
    }
    const { i, it } = items[k++];
    markSpeaking(i);
    say([partPeriod(i), partSubject(it)], step);
  };
  say([MSG.readIntro], step);
}

function applyTtsUI() {
  const btn = document.getElementById("btn-sound");
  if (!btn) return;
  btn.classList.toggle("off", !ttsOn);
  btn.setAttribute("aria-pressed", String(ttsOn));
  btn.querySelector(".ico").textContent = ttsOn ? "🔊" : "🔇";
  // 音がオフのあいだは「よみあげ」も押せない
  document.getElementById("btn-read").disabled = !ttsOn;
}

function loadTts() {
  try {
    const raw = localStorage.getItem(TTS_KEY);
    if (raw !== null) ttsOn = raw === "1";
  } catch (_) {}
}

function saveTts() {
  try { localStorage.setItem(TTS_KEY, ttsOn ? "1" : "0"); } catch (_) {}
}

// ── 描画 ─────────────────────────────────
function render() {
  renderSlots();
  renderPalette();
  renderBanner();
}

function renderSlots() {
  const container = document.getElementById("slots");
  container.innerHTML = "";

  schedule.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "slot";

    const canReceive = selected && !selected.isClear;
    const canErase   = selected && selected.isClear && item;

    if (canReceive) { div.classList.add("can-receive"); }
    else if (canErase) { div.classList.add("can-erase"); }
    else if (item) {
      div.classList.add("filled");
      div.style.borderColor = item.color;
      div.style.background  = item.bg;
    }

    // 時間ラベル
    const lbl = document.createElement("div");
    lbl.className = "slot-label";
    lbl.textContent = PERIOD_SHORT[i];
    div.appendChild(lbl);

    // 教科エリア
    const content = document.createElement("div");
    content.className = "slot-content";

    if (item) {
      content.appendChild(makeVisual(item, "slot"));

      const nm = document.createElement("div");
      nm.className = "slot-name";
      nm.style.color = item.color;
      nm.textContent = item.kana;
      content.appendChild(nm);
    } else {
      const hint = document.createElement("span");
      hint.className = "slot-hint";
      hint.textContent = (canReceive || canErase) ? "▶ ここ！" : "あいてるよ";
      content.appendChild(hint);
    }

    div.appendChild(content);

    if (canReceive || canErase) {
      div.addEventListener("click", () => handlePeriodTap(i));
    } else if (item) {
      // カードを選んでいないときは、タップでそのコマだけ聞きなおせる
      div.style.cursor = "pointer";
      div.addEventListener("click", () => {
        stopSpeak();
        markSpeaking(i);
        say([partPeriod(i), partSubject(item)], clearSpeakingMark);
      });
    }

    container.appendChild(div);
  });
}

// 教科の絵（画像）。画像がない／読み込めないときは絵文字にフォールバックする。
// where は "slot"（コマ）／"st"（せってい画面）／それ以外（カード）。
const IMG_CLASS   = { slot:"slot-img",   st:"st-img"   };
const EMOJI_CLASS = { slot:"slot-emoji", st:"st-emoji" };

function makeVisual(subject, where) {
  const src = imgSrc(subject);
  if (src) {
    const im = document.createElement("img");
    im.className = IMG_CLASS[where] || "card-img";
    im.src = src;
    im.alt = flat(subject);
    im.draggable = false;
    im.addEventListener("error", () => {
      im.replaceWith(makeEmoji(subject, where));
    });
    return im;
  }
  return makeEmoji(subject, where);
}

function makeEmoji(subject, where) {
  const em = document.createElement("span");
  em.className = EMOJI_CLASS[where] || "card-emoji";
  em.textContent = subject.emoji || "❓";
  return em;
}

function renderPalette() {
  const container = document.getElementById("palette");
  container.innerHTML = "";

  orderedSubjects().forEach(subject => {
    const div = document.createElement("div");
    div.className = "card" + (selected?.id === subject.id ? " selected" : "");
    div.style.setProperty("--col", subject.color);
    div.style.setProperty("--c40", subject.color + "40");
    div.style.borderColor = selected?.id === subject.id ? subject.color : "#E0E8F0";
    div.style.background  = selected?.id === subject.id ? subject.bg : "rgba(255,255,255,0.92)";

    // 絵
    div.appendChild(makeVisual(subject, "card"));

    // 絵の下に、ひらがなの教科名
    const nm = document.createElement("div");
    nm.className = "card-kana";
    nm.style.color = subject.color;
    nm.textContent = subject.kana;
    div.appendChild(nm);

    div.addEventListener("click", () => handleSubjectTap(subject));
    container.appendChild(div);
  });
}

function renderBanner() {
  const banner = document.getElementById("banner");
  if (selected) {
    banner.classList.add("ready");
    if (selected.isClear) {
      banner.textContent = "どのじかんを けす？";
    } else {
      banner.textContent = `👆「${flat(selected)}」を なんじかんめに いれる？`;
    }
  } else {
    banner.classList.remove("ready");
    banner.textContent = "かもくカードを えらんでね";
  }
}

// ── イベント ──────────────────────────────
function handleSubjectTap(subject) {
  const wasSelected = selected?.id === subject.id;
  selected = wasSelected ? null : subject;
  render();

  stopSpeak();
  if (selected) {
    say([selected.isClear ? MSG.askErase : partSubject(selected)]);
  }
}

function handlePeriodTap(index) {
  if (!selected) return;
  const erasing = selected.isClear;
  schedule[index] = erasing ? null : selected;
  const placed = selected;
  selected = null;
  render();

  stopSpeak();
  // 消したときは「けしたよ」だけ。時限を言わせたい場合は
  // sounds/period1_wo.mp3 …（「いちじかんめを」）を用意して
  // ここに partPeriodWo(index) を足す。
  say(erasing
    ? [MSG.erased]
    : [partPeriod(index), partSubject(placed)]);
}

document.getElementById("btn-save").addEventListener("click", saveSchedule);
document.getElementById("btn-reset").addEventListener("click", () => {
  schedule = Array(6).fill(null);
  selected = null;
  render();
  stopSpeak();
  say([MSG.reset]);
});

// 「よみあげ」— 読み上げ中にもう一度押したら止める
document.getElementById("btn-read").addEventListener("click", () => {
  const reading = document.getElementById("btn-read").classList.contains("speaking");
  if (reading) { stopSpeak(); return; }
  readAll();
});

// 「おと」— 読み上げのオン／オフ
document.getElementById("btn-sound").addEventListener("click", () => {
  ttsOn = !ttsOn;
  saveTts();
  applyTtsUI();
  if (ttsOn) say([MSG.soundOn]);
  else stopSpeak();
});

// ── せってい（長押しで開く） ───────────────
const stBtn = document.getElementById("btn-settings");
const HOLD_MS = 800;
let holdTimer = null;
let holdFired = false;   // 長押しで開いた直後の click を捨てるための印

function holdStart() {
  if (holdTimer) return;
  holdFired = false;
  stBtn.classList.add("holding");
  holdTimer = setTimeout(() => {
    holdTimer = null;
    holdFired = true;
    stBtn.classList.remove("holding");
    openSettings();
  }, HOLD_MS);
}

function holdCancel() {
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  stBtn.classList.remove("holding");
}

stBtn.addEventListener("pointerdown", holdStart);
["pointerup", "pointerleave", "pointercancel"].forEach(ev =>
  stBtn.addEventListener(ev, holdCancel));
// 長押し中に選択メニューが出ないように
stBtn.addEventListener("contextmenu", e => e.preventDefault());
// 短く押しただけのときは、開かずに使いかたを出す
stBtn.addEventListener("click", () => {
  if (holdFired) { holdFired = false; return; }
  showToast("hold");
});

document.getElementById("btn-settings-close").addEventListener("click", closeSettings);
document.getElementById("btn-settings-reset").addEventListener("click", () => {
  if (!confirm("かもくカードの もじ・え・おと・ならびじゅんを\nぜんぶ もとに もどします。よろしいですか？")) return;
  resetAllCards();
});
document.getElementById("settings").addEventListener("click", e => {
  if (e.target.id === "settings") closeSettings();   // 外側を押したら閉じる
});

function openSettings() {
  stopSpeak();
  selected = null;
  render();
  renderSettings();
  document.getElementById("settings").hidden = false;
  probeOriginalSounds();   // 「▶ もとの おと」が本当に鳴るか確かめる
}

function closeSettings() {
  cancelRecord();
  stopSpeak();
  document.getElementById("settings").hidden = true;
  render();
}

function stBtnEl(label, cls) {
  const b = document.createElement("button");
  b.className = "st-btn" + (cls ? " " + cls : "");
  b.type = "button";
  b.textContent = label;
  return b;
}

function renderSettings() {
  const list = document.getElementById("settings-list");
  list.innerHTML = "";

  const subs = orderedSubjects().filter(s => !s.isClear);

  subs.forEach((s, idx) => {
    const row = document.createElement("div");
    row.className = "st-row";

    // ── ならびかえ ──
    const ord = document.createElement("div");
    ord.className = "st-ord";
    const up = stBtnEl("▲"), dn = stBtnEl("▼");
    up.disabled = idx === 0;
    dn.disabled = idx === subs.length - 1;
    up.title = "うえへ";
    dn.title = "したへ";
    up.addEventListener("click", () => moveCard(s.id, -1));
    dn.addEventListener("click", () => moveCard(s.id, +1));
    ord.append(up, dn);

    // ── 絵 ──
    const thumb = document.createElement("div");
    thumb.className = "st-thumb";
    thumb.appendChild(makeVisual(s, "st"));

    // ── もじ（かいぎょうで2ぎょうにできる） ──
    const ta = document.createElement("textarea");
    ta.className = "st-kana";
    ta.rows = 2;
    ta.value = s.kana;
    ta.setAttribute("aria-label", "かもくの なまえ");
    ta.addEventListener("input", () => {
      const v = ta.value.replace(/\r/g, "");
      if (!v.trim() || v === DEFAULT_KANA[s.id]) delete cardConf[s.id];
      else cardConf[s.id] = { kana: v };
      applyCardConf();
      saveCards();
      render();   // パレットとコマにすぐ反映（せってい画面は作り直さない）
    });

    // ── そうさボタン ──
    const acts = document.createElement("div");
    acts.className = "st-acts";

    const fImg = document.createElement("input");
    fImg.type = "file"; fImg.accept = "image/*"; fImg.hidden = true;
    fImg.addEventListener("change", () => {
      if (fImg.files[0]) setCardMedia(s.id, "img", fImg.files[0]);
      fImg.value = "";
    });
    const bImg = stBtnEl(customImg[s.id] ? "🖼 え ✓" : "🖼 え", customImg[s.id] ? "has" : "");
    bImg.addEventListener("click", () => fImg.click());

    // おとは マイクで録音する。録音中は同じボタンが「とめる」になる。
    const recording = rec && rec.id === s.id;
    const bRec = stBtnEl(recording ? `⏹ とめる ${recSec()}` : "🎙 ろくおん", recording ? "recbtn rec" : "recbtn");
    if (recording) bRec.id = "st-rec-active";
    bRec.addEventListener("click", () => (rec ? stopRecord() : startRecord(s.id)));

    // いま鳴る音の種類を、ボタンの文字で見せる
    const bPlay = stBtnEl("▶ きく", "play");
    bPlay.dataset.playId = s.id;
    bPlay.addEventListener("click", () => { stopSpeak(); say([partSubject(s)]); });

    const bUndo = stBtnEl("↩ もどす", "warn");
    bUndo.disabled = !cardConf[s.id] && !customImg[s.id] && !customSnd[s.id];
    bUndo.title = "このカードの もじ・え・おとを もとにもどす";
    bUndo.addEventListener("click", () => resetCard(s.id));

    acts.append(bImg, fImg, bRec, bPlay, bUndo);
    row.append(ord, thumb, ta, acts);
    list.appendChild(row);
  });

  refreshPlayLabels();

  // 録音中は、とめるボタン以外を押せなくする
  const busy = !!rec;
  list.querySelectorAll(".st-btn").forEach(b => {
    if (busy && b.id !== "st-rec-active") b.disabled = true;
  });
  document.getElementById("btn-settings-reset").disabled = busy;
}

// ── 「▶」ボタンに、いま鳴る音の種類を出す ──
// もとの音声ファイルが本当に鳴らせるかは、開いたときに確かめる。
const origSndOk = {};   // id → true（鳴る）／false（ファイルが無い）

function playLabel(s) {
  if (customSnd[s.id])           return ["▶ ろくおん",   "has"];
  if (origSndOk[s.id] === true)  return ["▶ もとの おと", ""];
  if (origSndOk[s.id] === false) return ["▶ よみあげ",   ""];   // 合成音声で読む
  return ["▶ きく", ""];                                         // まだ確かめ中
}

// 文字を書いている途中でも邪魔しないよう、作り直さずにボタンの字だけ変える
function refreshPlayLabels() {
  document.querySelectorAll("#settings-list [data-play-id]").forEach(b => {
    const s = SUBJECTS.find(x => x.id === b.dataset.playId);
    if (!s) return;
    const [label, cls] = playLabel(s);
    b.textContent = label;
    b.classList.toggle("has", cls === "has");
  });
}

// 開くたびに呼ぶ。鳴ると分かったものは そのまま、読めなかったものは
// 確かめなおす（サーバーや Wi-Fi が戻っていれば「もとの おと」に戻る）。
function probeOriginalSounds() {
  SUBJECTS.forEach(s => {
    if (s.isClear || origSndOk[s.id] === true) return;
    delete origSndOk[s.id];
    const a = new Audio();
    a.preload = "metadata";
    let settled = false;
    const done = ok => {
      if (settled) return;
      settled = true;
      origSndOk[s.id] = ok;
      refreshPlayLabels();
    };
    a.addEventListener("loadedmetadata", () => done(true),  { once: true });
    a.addEventListener("error",          () => done(false), { once: true });
    a.src = SOUND_DIR + s.id + ".mp3";
  });
}

// ── 録音 ──────────────────────────────────
// マイクの許可は ブラウザが たずねる。録音は この端末の中だけに残る。
const REC_MAX_SEC = 10;   // 押しっぱなしで長くなりすぎないように
let rec = null;           // { id, mr, stream, chunks, startedAt, timer, cancelled }

const recSec = () => rec ? Math.floor((Date.now() - rec.startedAt) / 1000) : 0;

function pickRecMime() {
  const cands = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  return cands.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
}

async function startRecord(id) {
  if (rec) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    showToast("recUnsupported");
    return;
  }
  stopSpeak();

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (_) {
    showToast("micDenied");
    return;
  }

  const mime = pickRecMime();
  let mr;
  try {
    mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  } catch (_) {
    stream.getTracks().forEach(t => t.stop());
    showToast("recUnsupported");
    return;
  }

  const chunks = [];
  mr.addEventListener("dataavailable", e => { if (e.data && e.data.size) chunks.push(e.data); });
  mr.addEventListener("stop", async () => {
    const r = rec;
    rec = null;
    clearInterval(r.timer);
    stream.getTracks().forEach(t => t.stop());   // マイクを はなす

    const blob = new Blob(chunks, { type: mr.mimeType || mime || "audio/webm" });
    if (r.cancelled || blob.size === 0) { renderSettings(); return; }

    await setCardMedia(id, "snd", blob, "recDone");
    // 録れた音を そのまま聞かせる
    const s = SUBJECTS.find(x => x.id === id);
    if (s) say([partSubject(s)]);
  });

  rec = { id, mr, stream, startedAt: Date.now(), timer: null, cancelled: false };
  rec.timer = setInterval(() => {
    if (!rec) return;
    const sec = recSec();
    const b = document.getElementById("st-rec-active");
    if (b) b.textContent = `⏹ とめる ${sec}`;
    if (sec >= REC_MAX_SEC) stopRecord();
  }, 250);

  mr.start();
  renderSettings();
}

function stopRecord() {
  if (rec && rec.mr.state !== "inactive") rec.mr.stop();
}

// 画面を閉じたときなどは、録音を すてる
function cancelRecord() {
  if (!rec) return;
  rec.cancelled = true;
  stopRecord();
}

function moveCard(id, dir) {
  const ids = orderedSubjects().filter(s => !s.isClear).map(s => s.id);
  const i = ids.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  cardOrder = ids;
  saveCards();
  renderSettings();
  render();
}

// 絵／音を 入れ替える。kind は "img" か "snd"。file は File でも Blob でもよい。
async function setCardMedia(id, kind, file, toastType) {
  try {
    await mediaSet(kind + ":" + id, file);
  } catch (_) {
    showToast("mediaError");   // 容量オーバーなど
    return;
  }
  const map = kind === "img" ? customImg : customSnd;
  dropMediaUrl(map, id);
  map[id] = URL.createObjectURL(file);
  renderSettings();
  render();
  showToast(toastType || (kind === "img" ? "imgSet" : "sndSet"));
}

async function resetCard(id) {
  try { await mediaDel("img:" + id); await mediaDel("snd:" + id); } catch (_) {}
  dropMediaUrl(customImg, id);
  dropMediaUrl(customSnd, id);
  delete cardConf[id];
  applyCardConf();
  saveCards();
  renderSettings();
  render();
  showToast("cardReset");
}

async function resetAllCards() {
  try {
    const keys = await mediaKeys();
    for (const k of keys) await mediaDel(k);
  } catch (_) {}
  SUBJECTS.forEach(s => { dropMediaUrl(customImg, s.id); dropMediaUrl(customSnd, s.id); });
  cardConf  = {};
  cardOrder = null;
  applyCardConf();
  saveCards();
  renderSettings();
  render();
  showToast("cardReset");
}

// ── 保存・読み込み ────────────────────────
function saveSchedule() {
  try {
    const ids = schedule.map(s => s?.id || null);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(ids));
    showToast("saved");
    stopSpeak();
    say([MSG.saved]);
  } catch (_) {
    showToast("error");
  }
}

function loadSchedule() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const ids = JSON.parse(raw);
    schedule = ids.map(id => id ? SUBJECTS.find(s => s.id === id) || null : null);
    showToast("loaded");
  } catch (_) {}
}

// ── トースト ──────────────────────────────
const TOASTS = {
  saved:      ["💾 ほぞんしました！",            "#2ECC71"],
  loaded:     ["📂 よみこみました！",            "#2ECC71"],
  error:      ["⚠️ ほぞんできませんでした",      "#E74C3C"],
  hold:       ["⚙️ ながおし すると ひらくよ",    "#8E44AD"],
  imgSet:     ["🖼 えを かえました",             "#2ECC71"],
  sndSet:     ["🔊 おとを かえました",           "#2ECC71"],
  recDone:    ["🎙 ろくおん しました",           "#2ECC71"],
  micDenied:  ["⚠️ マイクが つかえません（きょかを してください）", "#E74C3C"],
  recUnsupported: ["⚠️ この ブラウザでは ろくおん できません", "#E74C3C"],
  mediaError: ["⚠️ この ファイルは つかえません", "#E74C3C"],
  cardReset:  ["↩ もとに もどしました",          "#2ECC71"],
};

function showToast(type) {
  const t = TOASTS[type];
  if (!t) return;
  const el = document.getElementById("toast");
  clearTimeout(toastTimer);
  el.textContent     = t[0];
  el.style.background = t[1];
  el.style.display   = "block";
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 2000);
}

// ── 起動 ─────────────────────────────────
loadTts();
applyTtsUI();   // 音声ファイルで鳴らすので、合成音声が無いブラウザでもボタンは出す
loadCards();
loadSchedule();
render();
// 自前の絵と音は IndexedDB から あとで届くので、届いたら描きなおす
loadCustomMedia().then(() => {
  render();
  if (!document.getElementById("settings").hidden) renderSettings();
});
</script>
