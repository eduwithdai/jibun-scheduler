<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>きょうの じかんわり</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    background: linear-gradient(160deg, #FFF8EE 0%, #EEF6FF 100%);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* ── ヘッダー ── */
  #header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: rgba(255,255,255,0.92);
    border-bottom: 3px solid #FFD080;
    flex-shrink: 0;
    min-height: 64px;
  }

  #title {
    font-size: 18px;
    font-weight: bold;
    color: #E67E22;
    white-space: nowrap;
  }

  #banner {
    flex: 1;
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    color: #5D6D7E;
    background: #F4F6F7;
    border: 3px solid #D5D8DC;
    border-radius: 36px;
    padding: 10px 16px;
    transition: all 0.2s;
    line-height: 1.2;
  }
  #banner.ready {
    color: #C0392B;
    background: #FEF0E7;
    border-color: #E67E22;
  }

  .hdr-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 64px;
    min-height: 52px;
    border-radius: 16px;
    border-width: 3px;
    border-style: solid;
    cursor: pointer;
    font-weight: bold;
    gap: 1px;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  .hdr-btn .ico { font-size: 22px; }
  .hdr-btn .lbl { font-size: 13px; white-space: nowrap; }
  #btn-save  { background:#EBF5FB; border-color:#AED6F1; color:#2471A3; }
  #btn-reset { background:#FDEDEC; border-color:#F5B7B1; color:#C0392B; }
  #btn-read  { background:#E8F8F5; border-color:#A3E4D7; color:#117A65; }
  #btn-sound { background:#FEF9E7; border-color:#F7DC6F; color:#9A7D0A; }
  /* 音がオフのとき／読み上げ中に押せないとき */
  .hdr-btn.off      { background:#F4F6F7; border-color:#D5D8DC; color:#98A3A8; }
  .hdr-btn[disabled] { opacity: 0.4; cursor: default; }
  /* 読み上げ中のボタン */
  #btn-read.speaking { background:#16A085; border-color:#0E6655; color:#fff; }

  /* ── メインエリア ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
    gap: 8px;
    padding: 8px;
    min-height: 0;
  }

  /* ── 左：スロット ── */
  #slots {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 38%;
    flex-shrink: 0;
    min-height: 0;
  }

  .slot {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 4px solid #D5D8DC;
    background: rgba(255,255,255,0.75);
    transition: all 0.18s;
    cursor: default;
    min-height: 0;
  }
  .slot.can-receive {
    border-color: #F39C12;
    background: #FFFBF0;
    box-shadow: 0 0 0 3px #F39C1240, 0 4px 12px rgba(0,0,0,0.1);
    transform: scale(1.02);
    cursor: pointer;
  }
  .slot.can-erase {
    border-color: #E74C3C;
    box-shadow: 0 0 0 3px #E74C3C40, 0 4px 12px rgba(0,0,0,0.1);
    transform: scale(1.02);
    cursor: pointer;
  }
  .slot.filled {
    box-shadow: 0 2px 6px rgba(0,0,0,0.07);
  }
  /* いま読み上げているコマ */
  .slot.speaking {
    outline: 5px solid #16A085;
    outline-offset: 2px;
    transform: scale(1.03);
  }

  /* 「1じかん」— 大きく・濃く */
  .slot-label {
    font-size: clamp(17px, 2.7vh, 27px);
    font-weight: bold;
    color: #46545E;
    min-width: 3.6em;
    flex-shrink: 0;
    line-height: 1.15;
    text-align: center;
  }
  .slot.can-receive .slot-label,
  .slot.can-erase .slot-label { color: #D35400; }

  .slot-content {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
    height: 100%;
  }
  .slot-img {
    max-height: 100%;
    max-width: 44%;
    flex-shrink: 0;
    object-fit: contain;
  }
  .slot-emoji { font-size: clamp(24px, 4vh, 38px); flex-shrink: 0; }
  .slot-name  {
    font-size: clamp(16px, 2.6vh, 26px);
    font-weight: bold;
    line-height: 1.15;
    white-space: pre-line;
  }

  /* 「あいてるよ」— 大きく・濃く */
  .slot-hint  {
    font-size: clamp(17px, 2.8vh, 28px);
    font-weight: bold;
    color: #7B8A91;
  }
  .slot.can-receive .slot-hint,
  .slot.can-erase  .slot-hint { color: #D35400; }

  /* ── 右：カードパレット ── */
  #palette {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    align-content: stretch;
    min-height: 0;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    border: 4px solid #E0E8F0;
    background: rgba(255,255,255,0.92);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: all 0.15s;
    padding: 6px 4px 4px;
    min-height: 0;
    overflow: hidden;
  }
  .card.selected {
    box-shadow: 0 0 0 4px var(--c40), 0 6px 20px rgba(0,0,0,0.15);
    transform: scale(1.07);
    outline: 3px solid var(--col);
    outline-offset: 3px;
  }
  /* 教科の絵 */
  .card-img {
    flex: 1;
    min-height: 0;
    width: 100%;
    object-fit: contain;
  }
  .card-emoji {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 5vh, 46px);
  }
  /* 絵の下に、ひらがなの教科名 */
  .card-kana {
    flex-shrink: 0;
    font-size: clamp(14px, 2.2vh, 21px);
    font-weight: bold;
    margin-top: 3px;
    text-align: center;
    line-height: 1.2;
    white-space: pre-line;
  }

  /* ── トースト ── */
  #toast {
    position: absolute;
    top: 74px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    padding: 12px 32px;
    border-radius: 36px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    z-index: 100;
    pointer-events: none;
    display: none;
    white-space: nowrap;
  }
</style>
</head>
<body>

<!-- ヘッダー -->
<div id="header">
  <div id="title">📅 じかんわり</div>
  <div id="banner">かもくカードを えらんでね</div>
  <button class="hdr-btn" id="btn-read">
    <span class="ico">📢</span><span class="lbl">よみあげ</span>
  </button>
  <button class="hdr-btn" id="btn-sound" aria-pressed="true">
    <span class="ico">🔊</span><span class="lbl">おと</span>
  </button>
  <button class="hdr-btn" id="btn-save">
    <span class="ico">💾</span><span class="lbl">ほぞん</span>
  </button>
  <button class="hdr-btn" id="btn-reset">
    <span class="ico">🔄</span><span class="lbl">リセット</span>
  </button>
</div>

<!-- メイン -->
<div id="main">
  <div id="slots"></div>
  <div id="palette"></div>
</div>

<!-- トースト -->
<div id="toast"></div>

<script>
// kana は画面に出すひらがなの教科名（改行は \n）。img があれば絵、なければ emoji を使う。
const SUBJECTS = [
  { id:"nichijo",  img:"images/nichijo.png",  kana:"にちじょう\nせいかつ", color:"#7D5A3C", bg:"#FDF3EB" },
  { id:"kokugo",   img:"images/kokugo.png",   kana:"こくご",              color:"#C0392B", bg:"#FDEDEC" },
  { id:"sansu",    img:"images/sansu.png",    kana:"さんすう",            color:"#E67E22", bg:"#FEF9E7" },
  { id:"zuko",     img:"images/zuko.png",     kana:"ずこう",              color:"#E91E8C", bg:"#FDE8F4" },
  { id:"seikatsu", img:"images/seikatsu.png", kana:"せいかつ",            color:"#1A7A42", bg:"#E9F7EF" },
  { id:"taiiku",   img:"images/taiiku.png",   kana:"たいいく",            color:"#D35400", bg:"#FEF5E7" },
  { id:"ongaku",   img:"images/ongaku.png",   kana:"おんがく",            color:"#7D3C98", bg:"#F4ECF7" },
  { id:"dotoku",   img:"images/dotoku.png",   kana:"どうとく",            color:"#B7950B", bg:"#FEFDE7" },
  { id:"sogo",     img:"images/sogo.png",     kana:"そうごう",            color:"#1F5E99", bg:"#EBF5FB" },
  { id:"tokkatsu", img:"images/tokkatsu.png", kana:"とくべつ\nかつどう",  color:"#0E7A6E", bg:"#E8F8F5" },
  { id:"jiritsu",  img:"images/jiritsu.png",  kana:"じりつ",              color:"#5B3DB8", bg:"#EFE8FF" },
  { id:"clear",    emoji:"✖️",                kana:"けす",                color:"#95A5A6", bg:"#F8F9F9", isClear:true },
];

const PERIOD_SHORT = ["1じかん","2じかん","3じかん","4じかん","5じかん","6じかん"];
// 読み上げ用。「4じかんめ」は「よじかんめ」と読ませたいので、かなで持つ。
const PERIOD_SPEAK = ["いちじかんめ","にじかんめ","さんじかんめ","よじかんめ","ごじかんめ","ろくじかんめ"];
const STORAGE_KEY  = "jikanwari_schedule";
const TTS_KEY      = "jikanwari_tts";

let schedule = Array(6).fill(null); // 各コマに入った subject or null
let selected  = null;               // 選択中の subject or null
let toastTimer = null;

const flat = s => s.kana.replace(/\n/g, "");

// ── 読み上げ ──────────────────────────────
// sounds/ の音声ファイルを鳴らす。ファイルが無い・読めないものは
// ブラウザ内蔵の音声合成で代用する。どちらもネットにはつながない。
const SOUND_DIR = "sounds/";
const synth = window.speechSynthesis || null;
let ttsOn   = true;   // 「おと」ボタンの状態
let jaVoice = null;   // 合成音声で使う日本語の声
let sayGen  = 0;      // 世代番号。stopSpeak で進めて、古い連鎖を捨てる。
let curAudio = null;  // いま鳴っている音声ファイル

const audioCache  = {};        // ファイル名 → Audio
const audioFailed = new Set(); // 読めなかったファイル名（以後は合成音声）

function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  jaVoice = vs.find(v => v.lang === "ja-JP")
         || vs.find(v => (v.lang || "").toLowerCase().startsWith("ja"))
         || null;
}
if (synth) {
  pickVoice();
  // 声の一覧は非同期で届くブラウザがある
  synth.addEventListener("voiceschanged", pickVoice);
}

// ── 読み上げの「ひとかたまり」 ──
// file があれば音声ファイル、無ければ text を合成音声で読む。
const partPeriod  = i => ({ file: `period${i + 1}.mp3`, text: PERIOD_SPEAK[i] + "は、" });
const partSubject = s => ({ file: s.isClear ? null : `${s.id}.mp3`, text: flat(s) });

const MSG = {
  askErase:  { file:"ask_erase.mp3",  text:"けす。どのじかんを けす？" },
  erased:    { file:"erased.mp3",     text:"けしたよ" },
  readIntro: { file:"read_intro.mp3", text:"きょうの じかんわりだよ" },
  empty:     { file:"empty.mp3",      text:"きょうの よていは まだ はいっていないよ" },
  saved:     { file:"saved.mp3",      text:"ほぞんしたよ" },
  reset:     { file:"reset.mp3",      text:"ぜんぶ けしたよ" },
  soundOn:   { file:"sound_on.mp3",   text:"おとを つけたよ" },
  cheer:     { file:"today.mp3",      text:"きょうも いちにち がんばろう" },
};

// パーツを順番に鳴らす。onEnd は最後まで鳴り終わったときだけ呼ぶ。
function say(parts, onEnd) {
  if (!ttsOn) { onEnd && onEnd(); return; }
  const gen = sayGen;
  let k = 0;
  const next = () => {
    if (gen !== sayGen) return;              // 途中で止められた
    if (k >= parts.length) { onEnd && onEnd(); return; }
    playPart(parts[k++], gen, next);
  };
  next();
}

function playPart(part, gen, done) {
  if (!part.file || audioFailed.has(part.file)) { speakText(part.text, gen, done); return; }

  let a = audioCache[part.file];
  if (!a) {
    a = new Audio(SOUND_DIR + part.file);
    a.preload = "auto";
    audioCache[part.file] = a;
  }
  curAudio = a;

  let settled = false;
  const finish = () => {
    if (settled) return;
    settled = true;
    if (curAudio === a) curAudio = null;
    if (gen === sayGen) done();
  };
  // 鳴らせなかったとき。ただし stopSpeak で止めた場合はここを通っても
  // 「壊れている」とは見なさない（gen がずれているので判別できる）。
  const fail = () => {
    if (settled) return;
    settled = true;
    if (curAudio === a) curAudio = null;
    if (gen !== sayGen) return;
    audioFailed.add(part.file);
    speakText(part.text, gen, done);
  };

  a.onended = finish;
  a.onerror = fail;
  try { a.currentTime = 0; } catch (_) {}
  const p = a.play();
  if (p && p.catch) p.catch(fail);
}

function speakText(text, gen, done) {
  if (!synth) { if (gen === sayGen) done(); return; }
  let settled = false;
  const finish = () => {
    if (settled) return;
    settled = true;
    if (gen === sayGen) done();
  };
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang  = "ja-JP";
    if (jaVoice) u.voice = jaVoice;
    u.rate  = 0.95;  // こども向けに少しゆっくり
    u.pitch = 1.05;
    u.onend = finish;
    u.onerror = finish;
    synth.speak(u);
  } catch (_) {
    finish();
  }
}

// 今鳴っているものを止める（連鎖読み上げも打ち切る）
function stopSpeak() {
  sayGen++;
  if (curAudio) {
    try { curAudio.pause(); curAudio.currentTime = 0; } catch (_) {}
    curAudio = null;
  }
  if (synth) { try { synth.cancel(); } catch (_) {} }
  clearSpeakingMark();
  setReadingUI(false);
}

function markSpeaking(i) {
  clearSpeakingMark();
  const el = document.querySelectorAll("#slots .slot")[i];
  if (el) el.classList.add("speaking");
}

function clearSpeakingMark() {
  document.querySelectorAll("#slots .slot.speaking")
    .forEach(el => el.classList.remove("speaking"));
}

function setReadingUI(reading) {
  const btn = document.getElementById("btn-read");
  if (btn) btn.classList.toggle("speaking", reading);
}

// 時間割をぜんぶ順番に読む
function readAll() {
  if (!ttsOn) return;
  stopSpeak();
  const gen = sayGen;

  const items = [];
  schedule.forEach((it, i) => { if (it) items.push({ i, it }); });

  if (items.length === 0) {
    say([MSG.empty]);
    return;
  }

  setReadingUI(true);
  let k = 0;
  const step = () => {
    if (gen !== sayGen) return;             // 途中で止められた
    if (k >= items.length) {                // 読み終わり → 最後にひとこと
      clearSpeakingMark();
      say([MSG.cheer], () => setReadingUI(false));
      return;
    }
    const { i, it } = items[k++];
    markSpeaking(i);
    say([partPeriod(i), partSubject(it)], step);
  };
  say([MSG.readIntro], step);
}

function applyTtsUI() {
  const btn = document.getElementById("btn-sound");
  if (!btn) return;
  btn.classList.toggle("off", !ttsOn);
  btn.setAttribute("aria-pressed", String(ttsOn));
  btn.querySelector(".ico").textContent = ttsOn ? "🔊" : "🔇";
  // 音がオフのあいだは「よみあげ」も押せない
  document.getElementById("btn-read").disabled = !ttsOn;
}

function loadTts() {
  try {
    const raw = localStorage.getItem(TTS_KEY);
    if (raw !== null) ttsOn = raw === "1";
  } catch (_) {}
}

function saveTts() {
  try { localStorage.setItem(TTS_KEY, ttsOn ? "1" : "0"); } catch (_) {}
}

// ── 描画 ─────────────────────────────────
function render() {
  renderSlots();
  renderPalette();
  renderBanner();
}

function renderSlots() {
  const container = document.getElementById("slots");
  container.innerHTML = "";

  schedule.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "slot";

    const canReceive = selected && !selected.isClear;
    const canErase   = selected && selected.isClear && item;

    if (canReceive) { div.classList.add("can-receive"); }
    else if (canErase) { div.classList.add("can-erase"); }
    else if (item) {
      div.classList.add("filled");
      div.style.borderColor = item.color;
      div.style.background  = item.bg;
    }

    // 時間ラベル
    const lbl = document.createElement("div");
    lbl.className = "slot-label";
    lbl.textContent = PERIOD_SHORT[i];
    div.appendChild(lbl);

    // 教科エリア
    const content = document.createElement("div");
    content.className = "slot-content";

    if (item) {
      content.appendChild(makeVisual(item, "slot"));

      const nm = document.createElement("div");
      nm.className = "slot-name";
      nm.style.color = item.color;
      nm.textContent = item.kana;
      content.appendChild(nm);
    } else {
      const hint = document.createElement("span");
      hint.className = "slot-hint";
      hint.textContent = (canReceive || canErase) ? "▶ ここ！" : "あいてるよ";
      content.appendChild(hint);
    }

    div.appendChild(content);

    if (canReceive || canErase) {
      div.addEventListener("click", () => handlePeriodTap(i));
    } else if (item) {
      // カードを選んでいないときは、タップでそのコマだけ聞きなおせる
      div.style.cursor = "pointer";
      div.addEventListener("click", () => {
        stopSpeak();
        markSpeaking(i);
        say([partPeriod(i), partSubject(item)], clearSpeakingMark);
      });
    }

    container.appendChild(div);
  });
}

// 教科の絵（画像）。画像がない／読み込めないときは絵文字にフォールバックする。
function makeVisual(subject, where) {
  if (subject.img) {
    const im = document.createElement("img");
    im.className = where === "slot" ? "slot-img" : "card-img";
    im.src = subject.img;
    im.alt = flat(subject);
    im.draggable = false;
    im.addEventListener("error", () => {
      im.replaceWith(makeEmoji(subject, where));
    });
    return im;
  }
  return makeEmoji(subject, where);
}

function makeEmoji(subject, where) {
  const em = document.createElement("span");
  em.className = where === "slot" ? "slot-emoji" : "card-emoji";
  em.textContent = subject.emoji || "❓";
  return em;
}

function renderPalette() {
  const container = document.getElementById("palette");
  container.innerHTML = "";

  SUBJECTS.forEach(subject => {
    const div = document.createElement("div");
    div.className = "card" + (selected?.id === subject.id ? " selected" : "");
    div.style.setProperty("--col", subject.color);
    div.style.setProperty("--c40", subject.color + "40");
    div.style.borderColor = selected?.id === subject.id ? subject.color : "#E0E8F0";
    div.style.background  = selected?.id === subject.id ? subject.bg : "rgba(255,255,255,0.92)";

    // 絵
    div.appendChild(makeVisual(subject, "card"));

    // 絵の下に、ひらがなの教科名
    const nm = document.createElement("div");
    nm.className = "card-kana";
    nm.style.color = subject.color;
    nm.textContent = subject.kana;
    div.appendChild(nm);

    div.addEventListener("click", () => handleSubjectTap(subject));
    container.appendChild(div);
  });
}

function renderBanner() {
  const banner = document.getElementById("banner");
  if (selected) {
    banner.classList.add("ready");
    if (selected.isClear) {
      banner.textContent = "どのじかんを けす？";
    } else {
      banner.textContent = `👆「${flat(selected)}」を なんじかんめに いれる？`;
    }
  } else {
    banner.classList.remove("ready");
    banner.textContent = "かもくカードを えらんでね";
  }
}

// ── イベント ──────────────────────────────
function handleSubjectTap(subject) {
  const wasSelected = selected?.id === subject.id;
  selected = wasSelected ? null : subject;
  render();

  stopSpeak();
  if (selected) {
    say([selected.isClear ? MSG.askErase : partSubject(selected)]);
  }
}

function handlePeriodTap(index) {
  if (!selected) return;
  const erasing = selected.isClear;
  schedule[index] = erasing ? null : selected;
  const placed = selected;
  selected = null;
  render();

  stopSpeak();
  // 消したときは「けしたよ」だけ。時限を言わせたい場合は
  // sounds/period1_wo.mp3 …（「いちじかんめを」）を用意して
  // ここに partPeriodWo(index) を足す。
  say(erasing
    ? [MSG.erased]
    : [partPeriod(index), partSubject(placed)]);
}

document.getElementById("btn-save").addEventListener("click", saveSchedule);
document.getElementById("btn-reset").addEventListener("click", () => {
  schedule = Array(6).fill(null);
  selected = null;
  render();
  stopSpeak();
  say([MSG.reset]);
});

// 「よみあげ」— 読み上げ中にもう一度押したら止める
document.getElementById("btn-read").addEventListener("click", () => {
  const reading = document.getElementById("btn-read").classList.contains("speaking");
  if (reading) { stopSpeak(); return; }
  readAll();
});

// 「おと」— 読み上げのオン／オフ
document.getElementById("btn-sound").addEventListener("click", () => {
  ttsOn = !ttsOn;
  saveTts();
  applyTtsUI();
  if (ttsOn) say([MSG.soundOn]);
  else stopSpeak();
});

// ── 保存・読み込み ────────────────────────
function saveSchedule() {
  try {
    const ids = schedule.map(s => s?.id || null);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(ids));
    showToast("saved");
    stopSpeak();
    say([MSG.saved]);
  } catch (_) {
    showToast("error");
  }
}

function loadSchedule() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const ids = JSON.parse(raw);
    schedule = ids.map(id => id ? SUBJECTS.find(s => s.id === id) || null : null);
    showToast("loaded");
  } catch (_) {}
}

// ── トースト ──────────────────────────────
function showToast(type) {
  const el = document.getElementById("toast");
  clearTimeout(toastTimer);
  if (type === "saved")  { el.textContent = "💾 ほぞんしました！";      el.style.background = "#2ECC71"; }
  if (type === "loaded") { el.textContent = "📂 よみこみました！";       el.style.background = "#2ECC71"; }
  if (type === "error")  { el.textContent = "⚠️ ほぞんできませんでした"; el.style.background = "#E74C3C"; }
  el.style.display = "block";
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 2000);
}

// ── 起動 ─────────────────────────────────
loadTts();
applyTtsUI();   // 音声ファイルで鳴らすので、合成音声が無いブラウザでもボタンは出す
loadSchedule();
render();
</script>
</body>
</html>
